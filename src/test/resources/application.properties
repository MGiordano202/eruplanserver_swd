# Configurazione usata solo dai test (sostituisce src/main/resources/application.properties).
# Nessuna variabile d'ambiente, nessun database o servizio esterno reale:
# i test @DataJpaTest usano un database H2 in memoria, gli altri non usano database.
spring.profiles.active=test
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Il progetto non ha template Thymeleaf: evita l'avviso "Cannot find template location"
spring.thymeleaf.check-template-location=false

# Errori attesi: alcuni test verificano apposta che il database rifiuti dati non validi
# (CF duplicato, nome troppo lungo) e che i controller rispondano 400 a parametri errati.
# Il risultato lo controllano le asserzioni, i log di questi errori sarebbero solo rumore.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
